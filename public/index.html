<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jev vs Jev</title>
<style>
  :root {
    --bg: #f4f1ea; --fg: #1d1d1b; --muted: #6b6b66; --panel: #fffdf8; --line: #ddd8cc;
    --light: #eee2c8; --dark: #a9825a; --hl: rgba(255, 214, 0, .55); --accent: #0f2a4a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #ececea; --muted: #9a9a95; --panel: #1f2126; --line: #34363c;
            --light: #c9b58f; --dark: #7a5a3a; --accent: #8fb4e6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .wrap { display: grid; gap: 20px; grid-template-columns: minmax(280px, 560px) minmax(260px, 1fr); max-width: 1100px; margin: 0 auto; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  .board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
           aspect-ratio: 1; width: 100%; border: 2px solid var(--dark); user-select: none; }
  .sq { display: flex; align-items: center; justify-content: center; position: relative;
        min-width: 0; min-height: 0; overflow: hidden; font-size: clamp(22px, 6vw, 44px); line-height: 1; }
  .sq .piece { display: block; height: 1em; line-height: 1; }
  .sq.light { background: var(--light); } .sq.dark { background: var(--dark); }
  .sq.hl::after { content: ""; position: absolute; inset: 0; background: var(--hl); }
  .sq .piece { position: relative; z-index: 1; color: #111; text-shadow: 0 0 2px #fff, 0 0 1px #fff; }
  .sq .piece.b { color: #111; text-shadow: 0 0 2px #fff; }
  .sq .piece.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000, 0 1px 1px #000; }
  .sq .coord { position: absolute; font-size: 10px; color: rgba(0,0,0,.55); left: 3px; top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; align-items: center; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; font-size: 14px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  label { font-size: 13px; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .status { font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 3px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .cands { display: grid; grid-template-columns: 5em 1fr 4em; gap: 4px 10px; align-items: center; font-variant-numeric: tabular-nums; }
  .cands.mcts { grid-template-columns: 5em 1fr 4.5em 4em 4.5em; }
  .cands .h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .note { font-size: 13px; margin-top: 8px; padding: 6px 8px; border-radius: 6px; background: rgba(15,42,74,.08); }
  select, input[type=number] { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 14px; }
  input[type=number] { width: 4.5em; }
  .moves { columns: 2; font-family: ui-monospace, Menlo, monospace; font-size: 13px; max-height: 320px; overflow: auto; }
  .moves div { break-inside: avoid; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<h1>♟ Jev vs Jev <span class="muted">· both players decide with TypeSafe System One</span></h1>
<div class="wrap">
  <div>
    <div class="board" id="board"></div>
    <div class="controls">
      <button id="new">New game</button>
      <button id="step" class="primary">One move</button>
      <button id="auto">▶ Autoplay</button>
      <label>Delay <input id="delay" type="range" min="0" max="3000" step="250" value="750" /> <span id="delayv">0.75 s</span></label>
    </div>
    <div class="controls">
      <label>Player
        <select id="mode">
          <option value="mcts">MCTS · Jev as policy + value</option>
          <option value="fast">Fast · one Jev call per move</option>
        </select>
      </label>
      <label id="simsLabel">Simulations <input id="sims" type="number" min="1" max="200" value="16" /></label>
      <label>Parallel <input id="conc" type="number" min="1" max="16" value="4" /></label>
    </div>
    <div class="panel">
      <div class="status" id="status">…</div>
      <div class="muted" id="usage"></div>
      <div class="err" id="err"></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <div class="status" id="lastTitle">Last move</div>
      <div class="muted" id="lastMeta"></div>
      <div class="cands" id="cands"></div>
      <div class="note" id="searchNote" hidden></div>
      <div style="margin-top:10px">
        <div class="muted">Position score from the mover's point of view: <b id="evalLabel">–</b></div>
        <div class="bar"><i id="evalBar" style="width:50%"></i></div>
        <div class="muted" style="margin-top:6px">Tactically sharp (Noul): <b id="tactical">–</b></div>
        <div class="bar"><i id="tacticalBar" style="width:0%"></i></div>
      </div>
    </div>
    <div class="panel">
      <div class="status">Game</div>
      <div class="moves" id="moves"></div>
    </div>
  </div>
</div>
<script>
const GLYPH = { p:"♟", n:"♞", b:"♝", r:"♜", q:"♛", k:"♚" };
const FILES = "abcdefgh";
const $ = (id) => document.getElementById(id);
let auto = false, inflight = false, timer = null;

function parseFen(fen) {
  const rows = fen.split(" ")[0].split("/");
  const grid = [];
  for (const row of rows) {
    const r = [];
    for (const ch of row) {
      if (/\d/.test(ch)) for (let i = 0; i < +ch; i++) r.push(null);
      else r.push({ type: ch.toLowerCase(), color: ch === ch.toUpperCase() ? "w" : "b" });
    }
    grid.push(r);
  }
  return grid;
}

function renderBoard(fen, last) {
  const grid = parseFen(fen);
  const board = $("board");
  board.innerHTML = "";
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const sqName = FILES[f] + (8 - r);
    const d = document.createElement("div");
    d.className = "sq " + ((r + f) % 2 ? "dark" : "light");
    if (last && (last.from === sqName || last.to === sqName)) d.classList.add("hl");
    if (f === 0 || r === 7) { const c = document.createElement("span"); c.className = "coord"; c.textContent = f === 0 && r === 7 ? "a1" : f === 0 ? String(8 - r) : FILES[f]; d.appendChild(c); }
    const p = grid[r][f];
    if (p) { const s = document.createElement("span"); s.className = "piece " + p.color; s.textContent = GLYPH[p.type]; d.appendChild(s); }
    board.appendChild(d);
  }
}

function pct(x) { return (x * 100).toFixed(0) + " %"; }
function fmtQ(q) { return q == null ? "–" : (q >= 0 ? "+" : "") + q.toFixed(2); }
let settingsSynced = false;
function syncSettings(st) {
  if (settingsSynced || !st) return;
  $("mode").value = st.mode; $("sims").value = st.simulations; $("conc").value = st.concurrency;
  settingsSynced = true;
}
async function pushSettings() {
  const body = { mode: $("mode").value, simulations: +$("sims").value, concurrency: +$("conc").value };
  $("simsLabel").style.opacity = body.mode === "mcts" ? 1 : .5;
  const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  render(await r.json());
}

function render(s) {
  const last = s.log[s.log.length - 1];
  syncSettings(s.settings);
  renderBoard(s.fen, last);
  const side = s.turn === "w" ? s.players.w : s.players.b;
  $("status").textContent = s.gameOver ? s.result
    : s.busy || inflight ? `${side} is thinking …` : `${side} to move${s.inCheck ? " (check)" : ""} · move ${s.moveNumber}`;
  $("usage").textContent = `Total tokens: ${s.totalUsage.input_tokens} in / ${s.totalUsage.output_tokens} out · plies: ${s.log.length}`;

  if (last) {
    $("lastTitle").textContent = `${last.player}: ${last.san}`;
    const isMcts = last.mode === "mcts";
    $("lastMeta").textContent = isMcts
      ? `MCTS ${last.simulations} sims · ${last.evaluations} Jev calls, ${last.cacheHits} cached · Q ${fmtQ(last.q)} · ${(last.ms/1000).toFixed(1)} s · ${last.model} · ${last.usage.input_tokens}/${last.usage.output_tokens} tokens`
      : `Fast · confidence ${last.confidence.toFixed(2)} · ${last.ms} ms · ${last.model} · ${last.usage.input_tokens}/${last.usage.output_tokens} tokens`;
    const cands = $("cands");
    cands.className = "cands" + (isMcts ? " mcts" : "");
    if (isMcts) {
      const maxV = Math.max(1, ...last.candidates.map(c => c.visits));
      cands.innerHTML = `<span class="h">move</span><span class="h">visits</span><span class="h"></span><span class="h">prior</span><span class="h">Q</span>` +
        last.candidates.map(c =>
          `<span>${c.san}</span><div class="bar"><i style="width:${(c.visits/maxV*100).toFixed(1)}%"></i></div><span>${c.visits}</span><span>${pct(c.prior)}</span><span>${fmtQ(c.q)}</span>`).join("");
      const note = $("searchNote");
      note.hidden = false;
      note.textContent = last.changedBySearch
        ? `Search overruled the prior: Jev's first instinct was ${last.priorBest}, the tree preferred ${last.san}.`
        : `Search confirmed Jev's first instinct (${last.priorBest}).`;
    } else {
      cands.innerHTML = last.candidates.map(c =>
        `<span>${c.san}</span><div class="bar"><i style="width:${(c.prior*100).toFixed(1)}%"></i></div><span>${pct(c.prior)}</span>`).join("");
      $("searchNote").hidden = true;
    }
    $("evalLabel").textContent = `${last.evaluation.toFixed(2)} · ${last.evaluationLabel}`;
    $("evalBar").style.width = (last.evaluation / 6 * 100).toFixed(0) + "%";
    $("tactical").textContent = pct(last.tactical);
    $("tacticalBar").style.width = (last.tactical * 100).toFixed(0) + "%";
  } else {
    $("lastTitle").textContent = "No move yet";
    $("lastMeta").textContent = ""; $("cands").innerHTML = ""; $("searchNote").hidden = true;
    $("evalLabel").textContent = "–"; $("evalBar").style.width = "50%";
    $("tactical").textContent = "–"; $("tacticalBar").style.width = "0%";
  }

  const pairs = [];
  for (let i = 0; i < s.history.length; i += 2)
    pairs.push(`<div>${i/2+1}. ${s.history[i]} ${s.history[i+1] ?? ""}</div>`);
  $("moves").innerHTML = pairs.join("");
  const mv = $("moves"); mv.scrollTop = mv.scrollHeight;

  $("step").disabled = s.gameOver || inflight;
  if (s.gameOver && auto) toggleAuto(false);
}

async function api(path, method = "GET") {
  const r = await fetch(path, { method });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error ?? r.statusText);
  return j;
}

async function step() {
  if (inflight) return;
  inflight = true; $("err").textContent = ""; $("step").disabled = true;
  try { render(await api("/api/step", "POST")); }
  catch (e) { $("err").textContent = "Error: " + e.message; if (auto) toggleAuto(false); }
  finally { inflight = false; $("step").disabled = false; }
}

function toggleAuto(on) {
  auto = on ?? !auto;
  $("auto").textContent = auto ? "⏸ Stop" : "▶ Autoplay";
  clearTimeout(timer);
  if (auto) loop();
}
async function loop() {
  if (!auto) return;
  await step();
  const s = await api("/api/state");
  if (auto && !s.gameOver) timer = setTimeout(loop, +$("delay").value);
  else toggleAuto(false);
}

$("new").onclick = async () => { toggleAuto(false); render(await api("/api/new", "POST")); };
$("step").onclick = step;
$("auto").onclick = () => toggleAuto();
$("mode").onchange = pushSettings; $("sims").onchange = pushSettings; $("conc").onchange = pushSettings;
$("delay").oninput = () => $("delayv").textContent = (+$("delay").value / 1000).toLocaleString("en-US") + " s";

api("/api/state").then(render).catch(e => $("err").textContent = e.message);
</script>
</body>
</html>
